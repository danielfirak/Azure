name: "Terraform Destroy via OIDC"

on:  
inputs:
      confirm_destroy:
        description: 'Type "DESTROY" to confirm teardown of dev environment'
        required: true
        type: string
        default: ''

jobs:
  terraform:   
    # Optional: If you configured your Azure Federated Credential using an 'Environment', 
    # uncomment the line below and create a GitHub Environment named 'production'.
    environment: tf-plan

    # Required permission to generate the OIDC token from GitHub
    permissions:
      id-token: write
      contents: read
    
    name: "Terraform CI/CD"
    runs-on: ubuntu-latest
    


    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest
          
      - name: Authenticate to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          
      - name: Terraform Init
        run: terraform init
        env:
           ARM_USE_OIDC: true

    
      - name: Terraform Plan
        run: terraform plan -destroy -out=destroy.tfplan
        env:
          ARM_USE_OIDC: true

      - name: Terraform Apply
        run: terraform apply destroy.tfplan
        env:
          ARM_USE_OIDC: true
